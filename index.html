<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rabit</title>
<!-- 첫 화면 (BR-92): 처리방침으로 바로 넘긴다. 빌드 20 이하 앱과 App Store Connect에 옛 주소
     https://donky-ey.github.io/rabit-privacy/ 가 박혀 있고, 도메인을 건 뒤 그 주소는 이 페이지 (rabit.run/)가 된다.
     주소는 모두 상대 경로라 github.io/rabit-privacy/ 아래에서도, rabit.run/ 에서도 같다.
     넘김은 JS 없이 meta refresh 0초로 된다 (script는 뒤로 가기 기록만 남기지 않게 덧댄 것). canonical도 상대 경로.
     옛 주소가 남은 빌드가 모두 사라진 뒤에 작은 첫 화면 (아래 목록 + 웹 도구)으로 바꾼다 -->
<meta http-equiv="refresh" content="0; url=privacy/">
<link rel="canonical" href="privacy/">
<script>location.replace('privacy/' + location.hash);</script>
<style>

@media (prefers-color-scheme: dark) {
  :root { --bg: #000000; --fg: #f2f2f7; --muted: #a1a1a6; --line: #38383a; --soft: #1c1c1e; --link: #5aa2ff; }
}

main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.75rem; line-height: 1.3; margin: 0 0 8px; }

</style>
</head>

<main>
<h1>rabit</h1>
<p>rabit(래빗)은 Apple 건강 기록으로 오늘 뛸 러닝을 정해 주는 iPhone · Apple Watch 앱이에요.</p>
